# ================================
# Server Configuration
# ================================
server.port=${PORT:8081}

# ================================
# Session & Cookie Security
# ================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Railway serves over HTTPS, so cookies can be marked secure-only there.
# Keep this false for local http://localhost testing, true once deployed.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Never leak stack traces or internal error details to the browser
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ================================
# MySQL Database Configuration
# ================================
# Falls back to local settings when the environment variables aren't set,
# so this still works unchanged on your laptop.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cargo_courier_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:me123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# Hibernate / JPA Configuration
# ================================
# ddl-auto=update -> Hibernate auto-creates/updates tables based on your Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ================================
# Thymeleaf Configuration
# ================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ================================
# Application Name
# ================================
spring.application.name=Cargo Express Courier System

# ================================
# Razorpay Payment Gateway
# ================================
# Get free TEST keys at https://dashboard.razorpay.com/app/keys (Test Mode toggle, top right)
# Never commit real live keys - use environment variables in production (Railway: set these in project Variables)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TiDyYPueSApIJN}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:J11rnWwAF5zcxMTfLWDaDdhC}

# payment.simulate=true: skips the real Razorpay API call (useful while account KYC is
# pending) and shows a local mock checkout instead, so the full flow still works for
# demos/viva. Set to false once Razorpay activation clears to use the real gateway again.
payment.simulate=${PAYMENT_SIMULATE:true}
