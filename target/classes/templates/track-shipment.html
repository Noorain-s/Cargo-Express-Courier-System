<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Track Shipments - Cargo Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #1e3c72; }
        .navbar-brand, .nav-link { color: #fff !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg px-4">
        <span class="navbar-brand">📦 Cargo Express</span>
        <div class="ms-auto">
            <a class="nav-link d-inline" th:href="${user.role.name() == 'ADMIN'} ? @{/admin/dashboard} : (${user.role.name() == 'STAFF'} ? @{/staff/dashboard} : @{/customer/dashboard})">Dashboard</a>
            <a class="nav-link d-inline ms-3" th:href="@{/logout}">Logout</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h4>Shipment Tracking</h4>

        <table class="table table-bordered bg-white mt-3">
            <thead class="table-dark">
                <tr>
                    <th>ID</th><th>Sender</th><th>Receiver</th><th>Type</th><th>Weight</th><th>Cost (₹)</th><th>Status</th>
                    <th th:if="${user.role.name() != 'CUSTOMER'}">Update Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(shipments)}">
                    <td colspan="8" class="text-center text-muted">No shipments found</td>
                </tr>
                <tr th:each="s : ${shipments}">
                    <td th:text="${s.id}"></td>
                    <td th:text="${s.sender.name}"></td>
                    <td th:text="${s.receiverName}"></td>
                    <td th:text="${s.packageType}"></td>
                    <td th:text="${s.weightKg}"></td>
                    <td th:text="${s.cost}"></td>
                    <td><span class="badge bg-info" th:text="${s.status}"></span></td>
                    <td th:if="${user.role.name() != 'CUSTOMER'}">
                        <form th:action="@{/shipment/updateStatus}" method="post" class="d-flex gap-2">
                            <input type="hidden" name="shipmentId" th:value="${s.id}">
                            <select name="newStatus" class="form-select form-select-sm">
                                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"
                                        th:selected="${st == s.status}"></option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-primary">Update</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
