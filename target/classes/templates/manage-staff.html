<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Staff - Cargo Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #1e3c72; }
        .navbar-brand, .nav-link { color: #fff !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg px-4">
        <span class="navbar-brand">📦 Cargo Express — Admin</span>
        <div class="ms-auto">
            <a class="nav-link d-inline" th:href="@{/admin/dashboard}">Dashboard</a>
            <a class="nav-link d-inline ms-3" th:href="@{/admin/login-activity}">Login Activity</a>
            <a class="nav-link d-inline ms-3" th:href="@{/logout}">Logout</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h4>Manage Staff</h4>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card p-4 mt-3" style="max-width:500px;">
            <h6>Add New Staff</h6>
            <form th:action="@{/admin/staff/add}" th:object="${newStaff}" method="post">
                <div class="mb-2">
                    <input type="text" name="fullName" class="form-control" placeholder="Full Name" required>
                </div>
                <div class="mb-2">
                    <input type="email" name="email" class="form-control" placeholder="Email" required>
                </div>
                <div class="mb-2">
                    <input type="text" name="phone" class="form-control" placeholder="Phone" required>
                </div>
                <div class="mb-2">
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Add Staff</button>
            </form>
        </div>

        <h5 class="mt-4">Current Staff</h5>
        <table class="table table-bordered bg-white">
            <thead class="table-dark">
                <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Action</th></tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(staffList)}">
                    <td colspan="5" class="text-center text-muted">No staff added yet</td>
                </tr>
                <tr th:each="s : ${staffList}">
                    <td th:text="${s.id}"></td>
                    <td th:text="${s.fullName}"></td>
                    <td th:text="${s.email}"></td>
                    <td th:text="${s.phone}"></td>
                    <td>
                        <form th:action="@{'/admin/staff/delete/' + ${s.id}}" method="post">
                            <button type="submit" class="btn btn-sm btn-danger">Remove</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
