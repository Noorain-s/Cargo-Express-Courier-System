<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Activity - Cargo Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #1e3c72; }
        .navbar-brand, .nav-link { color: #fff !important; }
        .badge-admin { background: #8e44ad; }
        .badge-staff { background: #2980b9; }
        .badge-customer { background: #27ae60; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg px-4">
        <span class="navbar-brand">📦 Cargo Express — Admin</span>
        <div class="ms-auto">
            <a class="nav-link d-inline" th:href="@{/admin/dashboard}">Dashboard</a>
            <a class="nav-link d-inline ms-3" th:href="@{/admin/staff}">Manage Staff</a>
            <a class="nav-link d-inline ms-3" th:href="@{/admin/login-activity}">Login Activity</a>
            <a class="nav-link d-inline ms-3" th:href="@{/logout}">Logout</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h4>Login Activity</h4>
        <p class="text-muted">Every time someone logs in, it shows up here — most recent first.</p>

        <table class="table table-bordered bg-white">
            <thead class="table-dark">
                <tr><th>#</th><th>Email</th><th>Role</th><th>Login Time</th></tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(logins)}">
                    <td colspan="4" class="text-center text-muted">No logins recorded yet</td>
                </tr>
                <tr th:each="l : ${logins}">
                    <td th:text="${l.id}"></td>
                    <td th:text="${l.email}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${l.role == 'ADMIN'} ? 'badge-admin' : (${l.role == 'STAFF'} ? 'badge-staff' : 'badge-customer')"
                              th:text="${l.role}"></span>
                    </td>
                    <td th:text="${#temporals.format(l.loginTime, 'dd-MM-yyyy HH:mm:ss')}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
