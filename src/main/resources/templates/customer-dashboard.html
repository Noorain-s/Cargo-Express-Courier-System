<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Dashboard - Cargo Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #1e3c72; }
        .navbar-brand, .nav-link { color: #fff !important; }
        .btn-book {
            background: #27ae60; color: #fff; border: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg px-4">
        <span class="navbar-brand">📦 Cargo Express</span>
        <div class="ms-auto">
            <a class="nav-link d-inline" th:href="@{/customer/dashboard}">Dashboard</a>
            <a class="nav-link d-inline ms-3" th:href="@{/shipment/book}">Book Shipment</a>
            <a class="nav-link d-inline ms-3" th:href="@{/shipment/track}">Track Shipments</a>
            <a class="nav-link d-inline ms-3" th:href="@{/logout}">Logout</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h4>Welcome, <span th:text="${user.fullName}"></span> 👋</h4>

        <div class="card p-4 mt-3" th:if="${customer}">
            <h6>Your Profile</h6>
            <p class="mb-1"><strong>Phone:</strong> <span th:text="${customer.phone}"></span></p>
            <p class="mb-0"><strong>Address:</strong> <span th:text="${customer.address}"></span></p>
        </div>

        <a th:href="@{/shipment/book}" class="btn btn-book mt-4 mb-3">+ Book New Shipment</a>

        <h5>My Shipments</h5>
        <table class="table table-bordered bg-white">
            <thead class="table-dark">
                <tr>
                    <th>ID</th><th>Receiver</th><th>Type</th><th>Weight</th><th>Cost (₹)</th><th>Status</th><th>Invoice</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(myShipments)}">
                    <td colspan="7" class="text-center text-muted">No shipments yet — book your first one!</td>
                </tr>
                <tr th:each="s : ${myShipments}">
                    <td th:text="${s.id}"></td>
                    <td th:text="${s.receiverName}"></td>
                    <td th:text="${s.packageType}"></td>
                    <td th:text="${s.weightKg}"></td>
                    <td th:text="${s.cost}"></td>
                    <td>
                        <span class="badge bg-info" th:text="${s.status}"></span>
                    </td>
                    <td>
                        <a th:href="@{'/shipment/invoice/' + ${s.id}}" class="btn btn-sm btn-outline-primary">View</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
